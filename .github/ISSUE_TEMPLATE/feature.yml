name: 页面与功能需求
description: 提出一项可独立实现的改动
title: "[需求] "
body:
  - type: textarea
    id: need
    attributes:
      label: 需要解决的问题
      placeholder: 在哪个页面，什么操作下，希望看到什么结果？
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 参考材料与内容依据
      description: 如涉及研究内容，请注明论文图号、页码或原始数据。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 用少量具体条件说明何时算完成。
